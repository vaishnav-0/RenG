name: Build and Publish

on:
  push:
    branches: [main]
    # Documentation-only commits must not consume a public version. Every other
    # push to main cuts a release.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# Releases are serialised. Two concurrent runs would resolve the same next
# version and race for one immutable coordinate, and cancelling a run mid-upload
# would leave a partially published version behind.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Require main for manual publication
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::Manual publication is allowed only from refs/heads/main"
          exit 1

      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release tooling and repository policy
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 tools/check_repository_policy.py --root .

      - id: release
        name: Resolve the next public version
        shell: bash
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${R2_PUBLIC_URL:-}" ]]; then
            echo "::error::Missing publishing value: R2_PUBLIC_URL"
            exit 1
          fi

          version="$(
            python3 tools/resolve_release_version.py \
              --properties-file gradle.properties \
              --repository-url "$R2_PUBLIC_URL"
          )"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  linux-release:
    needs: resolve-version
    name: Linux release gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Mesa EGL for the GL conformance suite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgles2

      - name: Test Linux and Android release outputs
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          ./gradlew --no-configuration-cache \
            -PVERSION_NAME="$VERSION" \
            :kmp:checkKotlinAbi \
            :kmp:testAndroidHostTest \
            :kmp:linuxX64Test \
            :kmp:compileKotlinLinuxArm64 \
            :kmp:bundleAndroidMainAar

      # Diagnostics only, and only after something has already failed. A Kotlin/Native test
      # failure reaches the Gradle console as "kotlin.AssertionError at null:-1" with its
      # message stripped, so without these two steps a failure on a hosted runner is
      # unreadable -- which is exactly how RenG's 0.3.0 publication failed closed. Neither
      # step runs on a green job, neither can turn a red job green, and neither touches a
      # gate, a gate's order, or R2.
      - name: Print failing test details (linux-release)
        if: failure()
        shell: bash
        run: python3 tools/print_test_failures.py kmp/build/test-results
      - name: Upload test reports (linux-release)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux-release
          path: |
            kmp/build/reports/tests/**
            kmp/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [resolve-version, linux-release]
    name: Publish kmp ${{ needs.resolve-version.outputs.version }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify publishing configuration
        shell: bash
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          required=(
            R2_ENDPOINT
            R2_BUCKET
            R2_PUBLIC_URL
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing publishing value: $name"
              exit 1
            fi
          done

      - name: Test and publish to isolated local repository
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: >-
          ./gradlew --no-configuration-cache clean
          -PVERSION_NAME="$VERSION"
          :kmp:checkKotlinAbi
          :kmp:testAndroidHostTest
          :kmp:macosArm64Test
          :kmp:compileKotlinIosArm64
          :kmp:compileKotlinIosSimulatorArm64
          :kmp:compileKotlinLinuxX64
          :kmp:compileKotlinLinuxArm64
          :kmp:bundleAndroidMainAar
          :kmp:publishAllPublicationsToLocalTestRepository
          :kmp:checkPomFileForAndroidPublication
          :kmp:checkPomFileForIosArm64Publication
          :kmp:checkPomFileForIosSimulatorArm64Publication
          :kmp:checkPomFileForKotlinMultiplatformPublication
          :kmp:checkPomFileForLinuxArm64Publication
          :kmp:checkPomFileForLinuxX64Publication
          :kmp:checkPomFileForMacosArm64Publication

      - name: Derive and verify local publication manifest
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          python3 tools/verify_publication.py local \
            --repository build/local-maven \
            --version "$VERSION" \
            --manifest "$RUNNER_TEMP/reng-release-manifest.txt"

      - name: Resolve six targets from isolated local repository
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          local_smoke_home="$(mktemp -d)"
          ./gradlew --no-configuration-cache \
            --gradle-user-home "$local_smoke_home" \
            --refresh-dependencies \
            -p consumer-smoke \
            -PrengVersion="$VERSION" \
            compileAndroidMain \
            compileKotlinIosArm64 \
            compileKotlinIosSimulatorArm64 \
            compileKotlinMacosArm64 \
            compileKotlinLinuxX64 \
            compileKotlinLinuxArm64

      - name: Reject any manifest key collision in R2
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python3 tools/verify_publication.py r2-preflight \
            --endpoint "$R2_ENDPOINT" \
            --bucket "$R2_BUCKET" \
            --version "$VERSION" \
            --manifest "$RUNNER_TEMP/reng-release-manifest.txt"

      - name: Publish coordinated KMP artifacts to R2
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: >-
          ./gradlew --no-configuration-cache
          -PVERSION_NAME="$VERSION"
          :kmp:publishAllPublicationsToR2Repository

      - name: Verify exact public artifacts and aggregate metadata
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          python3 tools/verify_publication.py public \
            --repository-url "$R2_PUBLIC_URL" \
            --version "$VERSION" \
            --manifest "$RUNNER_TEMP/reng-release-manifest.txt" \
            --attempts 12 \
            --retry-delay 5

      - name: Resolve six targets from the public repository without credentials
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          smoke_project="$(mktemp -d "$RUNNER_TEMP/reng-r2-consumer.XXXXXX")"
          public_gradle_home="$(mktemp -d "$RUNNER_TEMP/reng-r2-gradle-home.XXXXXX")"
          cp consumer-smoke/settings.gradle.kts "$smoke_project/"
          cp consumer-smoke/build.gradle.kts "$smoke_project/"
          cp -R consumer-smoke/src "$smoke_project/src"
          cp gradlew "$smoke_project/gradlew"
          cp -R gradle "$smoke_project/gradle"

          "$smoke_project/gradlew" --no-configuration-cache \
            --gradle-user-home "$public_gradle_home" \
            --refresh-dependencies \
            -p "$smoke_project" \
            -PrengRepositoryUrl="${R2_PUBLIC_URL%/}" \
            -PrengVersion="$VERSION" \
            compileAndroidMain \
            compileKotlinIosArm64 \
            compileKotlinIosSimulatorArm64 \
            compileKotlinMacosArm64 \
            compileKotlinLinuxX64 \
            compileKotlinLinuxArm64

      - id: completion
        name: Create immutable release completion record
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          record_key="$(
            python3 tools/verify_publication.py completion-create \
              --version "$VERSION" \
              --manifest "$RUNNER_TEMP/reng-release-manifest.txt" \
              --source-commit "$SOURCE_COMMIT" \
              --output "$RUNNER_TEMP/reng-release-completion.json"
          )"
          printf 'record_key=%s\n' "$record_key" >> "$GITHUB_OUTPUT"

      - name: Create release completion record in R2
        shell: bash
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          RECORD_KEY: ${{ steps.completion.outputs.record_key }}
          RUNNER_TEMP: ${{ runner.temp }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          aws --endpoint-url "$R2_ENDPOINT" s3api put-object \
            --bucket "$R2_BUCKET" \
            --key "$RECORD_KEY" \
            --body "$RUNNER_TEMP/reng-release-completion.json" \
            --content-type "application/json" \
            --if-none-match '*'

      - name: Verify public release completion record without credentials
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 tools/verify_publication.py completion-public \
            --repository-url "$R2_PUBLIC_URL" \
            --version "$VERSION" \
            --manifest "$RUNNER_TEMP/reng-release-manifest.txt" \
            --source-commit "$SOURCE_COMMIT" \
            --attempts 12 \
            --retry-delay 5

      # Diagnostics only, and only after something has already failed. A Kotlin/Native test
      # failure reaches the Gradle console as "kotlin.AssertionError at null:-1" with its
      # message stripped, so without these two steps a failure on a hosted runner is
      # unreadable -- which is exactly how RenG's 0.3.0 publication failed closed. Neither
      # step runs on a green job, neither can turn a red job green, and neither touches a
      # gate, a gate's order, or R2.
      - name: Print failing test details (publish)
        if: failure()
        shell: bash
        run: python3 tools/print_test_failures.py kmp/build/test-results
      - name: Upload test reports (publish)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-publish
          path: |
            kmp/build/reports/tests/**
            kmp/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
